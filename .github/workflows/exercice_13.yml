name: exercice_13 CI

on:
  push:
    paths:
      - 'exercice_13/**'
      - '.github/workflows/exercice_13.yml'
  pull_request:
    paths:
      - 'exercice_13/**'
      - '.github/workflows/exercice_13.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-exercice_13
  cancel-in-progress: false

defaults:
  run:
    working-directory: exercice_13

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run tests and generate reports
        run: ./mvnw --batch-mode test

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            exercice_13/target/surefire-reports
            exercice_13/target/site/jacoco
            exercice_13/target/cucumber-reports

      - name: Generate HTML surefire report
        if: always()
        run: ./mvnw --batch-mode surefire-report:report-only

      - name: Assemble Pages site
        run: |
          mkdir -p site/jacoco site/cucumber site/surefire
          cp -r target/site/jacoco/. site/jacoco/
          cp target/cucumber-reports/cucumber.html site/cucumber/index.html
          cp target/reports/surefire.html site/surefire/index.html
          cat > site/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>exercice_13 - Test reports</title>
            <style>
              body { font-family: system-ui, sans-serif; max-width: 640px; margin: 4rem auto; padding: 0 1rem; }
              h1 { font-size: 1.6rem; }
              ul { list-style: none; padding: 0; }
              li { margin: 0.75rem 0; }
              a { display: block; padding: 1rem; border: 1px solid #ddd; border-radius: 8px; text-decoration: none; color: #0366d6; }
              a:hover { background: #f6f8fa; }
            </style>
          </head>
          <body>
            <h1>exercice_13 - Test reports</h1>
            <ul>
              <li><a href="./jacoco/index.html">JaCoCo coverage report</a></li>
              <li><a href="./cucumber/index.html">Cucumber BDD report</a></li>
              <li><a href="./surefire/index.html">Surefire unit test report</a></li>
            </ul>
          </body>
          </html>
          EOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: exercice_13/site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
